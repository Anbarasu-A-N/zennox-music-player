name: ci
on: [push, pull_request]
permissions: { contents: read }

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Paths must not collide on case-insensitive filesystems (macOS, Windows)
        run: tools/check_case_collisions.sh
      - run: python3 tools/schema_test.py

  core-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift --version && swift test

  core-linux:
    runs-on: ubuntu-latest
    container: swift:6.0-jammy
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y libsqlite3-dev
      - run: swift test
